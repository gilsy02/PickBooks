name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: pickbooks-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # 휴대폰에서 바로 받을 수 있게 고정 주소의 릴리스에 APK를 올린다 (압축 없이).
      - name: Copy APK with fixed name
        run: cp build/app/outputs/flutter-apk/app-release.apk pickbooks.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 테스트 버전
          prerelease: true
          body: "휴대폰에서 pickbooks.apk 를 눌러 받은 뒤 설치하세요. 코드를 올릴 때마다 자동으로 바뀝니다."
          files: pickbooks.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr pickbooks-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pickbooks-ios-unsigned-ipa
          path: pickbooks-unsigned.ipa
