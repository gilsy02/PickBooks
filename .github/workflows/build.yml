name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # 출시용 서명 키: Secrets가 등록돼 있으면 key.properties를 만들고, 없으면 개발용 키로 서명된다.
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
            echo "SIGNED=release" >> $GITHUB_ENV
          else
            echo "출시용 키 없음: 개발용 키로 서명"
            echo "SIGNED=debug" >> $GITHUB_ENV
          fi
      - run: flutter build apk --release --target-platform android-arm64 --dart-define=YES24_PROXY_URL=${{ vars.YES24_PROXY_URL }}
      # 플레이스토어 업로드용(AAB): 출시용 키가 있을 때만 만든다.
      - if: env.SIGNED == 'release'
        run: flutter build appbundle --release --dart-define=YES24_PROXY_URL=${{ vars.YES24_PROXY_URL }}
      - if: env.SIGNED == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pickbooks-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pickbooks-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # 휴대폰에서 바로 받을 수 있게 고정 주소의 릴리스에 APK를 올린다 (압축 없이).
      - name: Copy APK with fixed name
        run: cp build/app/outputs/flutter-apk/app-release.apk pickbooks.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 테스트 버전
          prerelease: true
          body: "휴대폰에서 pickbooks.apk 를 눌러 받은 뒤 설치하세요. 코드를 올릴 때마다 자동으로 바뀝니다."
          files: pickbooks.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=YES24_PROXY_URL=${{ vars.YES24_PROXY_URL }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr pickbooks-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pickbooks-ios-unsigned-ipa
          path: pickbooks-unsigned.ipa
